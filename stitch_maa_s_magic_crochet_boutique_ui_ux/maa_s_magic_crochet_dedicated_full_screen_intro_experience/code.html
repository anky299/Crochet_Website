<!DOCTYPE html><html lang="en"><head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Maa's Magic Crochet — Opening Experience</title>
  <link rel="icon" type="image/png" href="../../assets/favicon.png"/>
  <link rel="icon" href="../../assets/favicon.ico"/>
  <link rel="apple-touch-icon" href="../../assets/favicon.png"/>
  <!-- Google Fonts: Playfair Display & Plus Jakarta Sans / Cormorant Garamond -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin="">
  <link href="https://fonts.googleapis.com/css2?family=Alex+Brush&amp;family=Playfair+Display:ital,wght@0,500;0,600;0,700;1,400;1,600&amp;family=Plus+Jakarta+Sans:wght@300;400;500;600&amp;display=swap" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet">
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            brand: {
              cream: '#FFF9F4',
              surface: '#FBF3EC',
              rose: '#C87573',
              darkrose: '#B25D5B',
              sage: '#728C6A',
              cocoa: '#36221D',
              muted: '#7A645F',
              border: '#EEDDD2'
            }
          },
          fontFamily: {
            serif: ['"Playfair Display"', 'Georgia', 'serif'],
            script: ['"Alex Brush"', 'cursive'],
            sans: ['"Plus Jakarta Sans"', 'sans-serif']
          }
        }
      }
    };
  </script>
  <style>
    /* Slow, understated craft animations */
    @keyframes bgSoftReveal {
      0% { opacity: 0; filter: blur(4px); }
      100% { opacity: 1; filter: blur(0); }
    }
    @keyframes flowerGentleEntrance {
      0% { opacity: 0; transform: translateY(18px) scale(0.96); }
      100% { opacity: 1; transform: translateY(0) scale(1); }
    }
    @keyframes subtleFadeUp {
      0% { opacity: 0; transform: translateY(12px); }
      100% { opacity: 1; transform: translateY(0); }
    }
    @keyframes softFloat {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-6px); }
    }

    .anim-bg {
      animation: bgSoftReveal 1.2s cubic-bezier(0.16, 1, 0.3, 1) forwards;
    }
    .anim-flower {
      opacity: 0;
      animation: flowerGentleEntrance 1.3s cubic-bezier(0.16, 1, 0.3, 1) 0.35s forwards;
    }
    .anim-float {
      animation: softFloat 7s ease-in-out infinite alternate;
    }
    .anim-title {
      opacity: 0;
      animation: subtleFadeUp 1.1s cubic-bezier(0.16, 1, 0.3, 1) 0.75s forwards;
    }
    .anim-tagline {
      opacity: 0;
      animation: subtleFadeUp 1.1s cubic-bezier(0.16, 1, 0.3, 1) 1.05s forwards;
    }
    .anim-cta {
      opacity: 0;
      animation: subtleFadeUp 1.1s cubic-bezier(0.16, 1, 0.3, 1) 1.35s forwards;
    }

    /* Transition out when Enter is clicked */
    .intro-exit {
      transition: opacity 0.85s cubic-bezier(0.4, 0, 0.2, 1), transform 0.85s cubic-bezier(0.4, 0, 0.2, 1);
      opacity: 0 !important;
      transform: scale(1.04) !important;
      pointer-events: none;
    }

    /* Background tactile subtle grain & vignette */
    .warm-vignette {
      background: radial-gradient(circle at 50% 45%, rgba(255, 255, 255, 0.85) 0%, rgba(255, 248, 242, 0.95) 60%, rgba(247, 235, 224, 0.85) 100%);
    }

    @media (prefers-reduced-motion: reduce) {
      .anim-bg, .anim-flower, .anim-title, .anim-tagline, .anim-cta, .anim-float {
        animation: none !important;
        opacity: 1 !important;
        transform: none !important;
      }
    }
  </style>
</head>
<body class="bg-[#FFF9F4] text-brand-cocoa font-sans antialiased overflow-hidden m-0 p-0 select-none">

  <!-- ========================================================
       FULL-VIEWPORT 100vw x 100vh SINGLE INTRO SCREEN
       ======================================================== -->
  <main id="intro-screen" class="relative w-screen h-screen flex flex-col justify-between items-center warm-vignette anim-bg px-6 py-8 md:py-12 z-50">
    
    <!-- Subtle top artisan brand eyebrow: balanced without clutter -->
    <header class="w-full flex justify-between items-center max-w-5xl pt-1"><div class="flex items-center gap-2 text-xs tracking-[0.16em] uppercase text-[#4A3530] font-semibold">
        <span class="w-1.5 h-1.5 rounded-full bg-[#8F3B39]"></span>
        <span class="">HANDCRAFTED WITH YARN &amp; LOVE</span>
      </div>
      <div class="text-xs tracking-[0.16em] uppercase text-[#4A3530] font-semibold hidden sm:block">
        <span class="">LOHARDAGA STUDIO</span>
      </div></header>

    <!-- Visual Focal Point: Perfectly proportioned composition filling the viewport harmoniously -->
    <section class="flex-1 flex flex-col items-center justify-center w-full max-w-2xl text-center my-auto">
      
      <!-- 1. LARGE CROCHET BOUQUET HERO (Dominant visual: 320-420px on desktop, 260-300px on mobile) -->
      <div class="anim-flower relative mb-6 md:mb-8 group">
        <!-- Soft natural ambient aura behind bouquet -->
        <div class="absolute -inset-6 md:-inset-8 bg-[#ECC9BF]/25 rounded-full blur-2xl -z-10 pointer-events-none transform group-hover:scale-105 transition-transform duration-1000"></div>
        
        <!-- Crochet Bouquet Frame with tactile crafted shadow -->
        <div class="anim-float relative w-[260px] sm:w-[320px] md:w-[380px] lg:w-[410px] aspect-square rounded-[36px] md:rounded-[44px] overflow-hidden p-2.5 bg-gradient-to-b from-[#FFFDFC] to-[#F7ECE4] border border-[#ECD9CE]/80 shadow-[0_20px_50px_-15px_rgba(180,120,105,0.22)] ring-1 ring-white/80">
          <img src="../exquisite_studio_photograph_of_a_handmade_crochet_flower_bouquet_centered_on_a/screen.png" alt="Handcrafted crochet bouquet by Maa's Magic Crochet featuring blooming rose, daisy, and tulip" class="w-full h-full object-cover object-center rounded-[28px] md:rounded-[36px] filter contrast-[1.03] saturate-[1.02]" loading="eager">
        </div>
      </div>

      <!-- 2. LARGE, READABLE & ELEGANT BRAND NAME -->
      <div class="anim-title mb-3 md:mb-4"><h1 class="text-3xl sm:text-4xl md:text-5xl lg:text-[3.6rem] leading-[1.1] font-serif font-bold tracking-[-0.01em] text-[#241410]">
          Maa's Magic <span class="font-medium italic text-[#8F3B39]">Crochet</span>
        </h1></div>

      <!-- 3. BRAND TAGLINE (Clear & tactile) -->
      <div class="anim-tagline mb-7 md:mb-9"><p class="text-sm sm:text-base md:text-lg text-[#44312D] tracking-[0.04em] font-medium">
          Small stitches, big happiness <span class="text-[#8F3B39] inline-block ml-0.5 font-semibold">♡</span>
        </p></div>

      <!-- 4. VISIBLE, ELEGANT CTA BUTTONS -->
      <div class="anim-cta flex flex-col sm:flex-row flex-wrap items-center justify-center gap-3 sm:gap-4 w-full max-w-2xl mx-auto">
        <!-- 1. Explore Collection -->
        <button id="explore-collection-btn" onclick="handleEnterMagic()" aria-label="Explore Maa's Magic Crochet Collection" class="group relative inline-flex items-center justify-center gap-2.5 px-6 sm:px-8 py-3.5 rounded-full bg-[#AD4C4A] text-white font-semibold text-sm sm:text-base tracking-[0.06em] shadow-[0_12px_28px_-6px_rgba(173,76,74,0.5)] hover:bg-[#943D3B] hover:shadow-[0_16px_34px_-6px_rgba(173,76,74,0.6)] hover:scale-[1.02] active:scale-[0.98] transition-all duration-300 cursor-pointer w-full sm:w-auto">
          <span class="text-white drop-shadow-sm">Explore Collection</span>
          <svg class="w-4 h-4 transform group-hover:translate-x-1 transition-transform duration-300 stroke-white" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2.5">
            <path stroke-linecap="round" stroke-linejoin="round" d="M14 5l7 7m0 0l-7 7m7-7H3"></path>
          </svg>
        </button>

        <!-- 2. Order on WhatsApp -->
        <button id="intro-whatsapp-btn" onclick="window.open('https://wa.me/918299779264?text=' + encodeURIComponent('Hello Maa’s Magic Crochet! I found your crochet studio and would like to know more about your products.'), '_blank')" aria-label="Order on WhatsApp" class="group relative inline-flex items-center justify-center gap-2.5 px-6 sm:px-8 py-3.5 rounded-full bg-[#466641] text-white font-semibold text-sm sm:text-base tracking-[0.06em] shadow-[0_12px_28px_-6px_rgba(70,102,65,0.4)] hover:bg-[#385234] hover:shadow-[0_16px_34px_-6px_rgba(70,102,65,0.5)] hover:scale-[1.02] active:scale-[0.98] transition-all duration-300 cursor-pointer w-full sm:w-auto">
          <span class="material-symbols-outlined text-[20px]">chat</span>
          <span class="text-white drop-shadow-sm">Order on WhatsApp</span>
        </button>

        <!-- 3. Custom Order -->
        <button id="intro-custom-order-btn" onclick="window.location.href='../../index.html#custom-orders'" aria-label="Open Custom Order Screen" class="group relative inline-flex items-center justify-center gap-2.5 px-6 sm:px-8 py-3.5 rounded-full bg-[#FFF9F4] text-[#8F3B39] border border-[#ECD9CE] font-semibold text-sm sm:text-base tracking-[0.06em] shadow-sm hover:bg-[#FBF3EC] hover:border-[#AD4C4A] hover:scale-[1.02] active:scale-[0.98] transition-all duration-300 cursor-pointer w-full sm:w-auto">
          <span class="material-symbols-outlined text-[20px]">auto_awesome</span>
          <span class="drop-shadow-sm">Custom Order</span>
        </button>
      </div>

    </section>

    <!-- Subtle bottom provenance footer -->
    <footer class="w-full flex justify-between items-center max-w-5xl pb-1 text-[11px] sm:text-xs text-brand-muted/70 tracking-[0.12em]"><div>
        <span class="text-[11px] sm:text-xs text-[#5A423D] font-medium tracking-[0.1em]">Hand-knotted with patience &amp; love</span>
      </div>
      <div class="flex items-center gap-4 text-[11px] sm:text-xs text-[#5A423D] font-medium tracking-[0.1em]">
        <span class="">100% Cotton &amp; Wool Yarn</span>
        <span class="w-1 h-1 rounded-full bg-[#8F3B39]"></span>
        <span class="">Bespoke Keepsakes</span>
      </div></footer>

    <!-- Reveal Confirmation Banner (Appears when Enter is clicked in interactive mode) -->
    <div id="transition-reveal-banner" class="hidden absolute inset-0 bg-[#FFF9F4] flex-col items-center justify-center text-center p-8 z-50">
      <div class="w-16 h-16 rounded-full bg-brand-surface border border-brand-border flex items-center justify-center mb-5 shadow-sm text-brand-rose text-2xl">
        ♡
      </div>
      <h2 class="text-3xl sm:text-4xl font-serif text-brand-cocoa font-semibold mb-2">Welcome to Our Studio</h2>
      <p class="text-brand-muted max-w-md text-sm sm:text-base mb-6">Transitioning smoothly into the atelier collection...</p>
      <button onclick="resetIntro()" class="px-6 py-2.5 rounded-full border border-brand-border text-xs uppercase tracking-widest text-brand-muted hover:bg-white transition-colors">
        Replay Intro
      </button>
    </div>

  </main>

  <script>
    function handleEnterMagic() {
      const intro = document.getElementById('intro-screen');
      const banner = document.getElementById('transition-reveal-banner');
      
      // Execute the smooth, slow fade and slight upward scale requested
      intro.classList.add('intro-exit');
      
      setTimeout(() => {
        banner.classList.remove('hidden');
        banner.classList.add('flex');
        intro.classList.remove('intro-exit');
      }, 850);
    }

    function resetIntro() {
      const banner = document.getElementById('transition-reveal-banner');
      banner.classList.add('hidden');
      banner.classList.remove('flex');
    }
  </script>




</body></html>
